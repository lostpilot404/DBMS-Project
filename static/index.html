<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b5d">
  <meta name="description" content="Hospital Management System database project">
  <title>CarePoint · Hospital Management System</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/workspace.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to main content</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#dashboard" aria-label="CarePoint home" data-action="navigate" data-view="dashboard">
        <span class="brand-mark" aria-hidden="true">+</span>
        <span class="brand-copy"><strong>CarePoint</strong><small>Hospital system</small></span>
      </a>
      <div class="nav-label">Workspace</div>
      <nav class="primary-nav" id="primaryNav"></nav>
      <div class="sidebar-footer">
        <span class="sidebar-footer-mark" aria-hidden="true">DB</span>
        <span><strong>Database-backed</strong><small>Synthetic academic demo only</small></span>
      </div>
    </aside>
    <button class="sidebar-backdrop" type="button" aria-label="Close navigation" data-action="close-nav"></button>

    <div class="main-column">
      <header class="topbar">
        <button class="icon-button menu-toggle" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false" data-action="toggle-nav">
          <span aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>
        </button>
        <div class="topbar-heading">
          <span class="eyebrow">Hospital management</span>
          <h1 id="pageTitle" tabindex="-1">Dashboard</h1>
        </div>
        <div class="topbar-meta">
          <span class="current-date" id="currentDate"></span>
          <span class="connection-state" id="connectionState" role="status" aria-live="polite">
            <span class="connection-dot" aria-hidden="true"></span>
            <span id="connectionLabel">Connecting</span>
          </span>
        </div>
      </header>

      <main class="main-content" id="mainContent" tabindex="-1" aria-live="polite">
        <div class="loading-state"><span class="spinner" aria-hidden="true"></span> Loading hospital records…</div>
      </main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
